name: daily-episode

on:
  # PRIMARY trigger: an external scheduler commits a timestamp to
  # .github/trigger at 01:35 UTC. GitHub's own cron proved unreliable on this
  # repo — it skips firings entirely or runs ~3 h late, well past the 05:45
  # Europe/Helsinki deadline — so the push is what actually ships the episode.
  push:
    branches:
      - master
    paths:
      - ".github/trigger"
  schedule:
    # Backup only, kept because it costs nothing: 01:30 UTC = 04:30 EEST /
    # 03:30 EET, with a retry 45 min later. Whenever these do fire,
    # src/guard.py no-ops them if the episode is already published.
    - cron: "30 1 * * *"
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      test_short:
        description: "Build a ~5 min test episode"
        default: "false"
      episode_date:
        description: "Override episode date (YYYY-MM-DD, optional)"
        default: ""

concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TEST_SHORT: ${{ github.event.inputs.test_short || 'false' }}
      EPISODE_DATE: ${{ github.event.inputs.episode_date || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Guards every automatic trigger (push + schedule) so a redundant
      # firing costs nothing. Only an explicit workflow_dispatch bypasses it,
      # which is what makes a deliberate same-day rebuild always work.
      - name: Skip if today's episode already shipped
        id: guard
        if: github.event_name != 'workflow_dispatch'
        run: python -m src.guard

      - name: Install ffmpeg
        if: steps.guard.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Update preferences from reactions
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.update_preferences

      - name: Fetch candidate stories
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.fetch

      - name: Extract full text
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.extract

      - name: Curate
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.curate

      - name: Write script
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.write_script

      - name: Synthesize audio
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.tts

      - name: Publish release + feed
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.publish

      - name: Create rating issue
        if: steps.guard.outputs.skip != 'true'
        run: python -m src.feedback

      - name: Commit state (data/ + docs/)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "episode $(date -u +%F) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do
            git push && break
            echo "push failed; rebasing and retrying in $((i*2))s"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((i*2))
          done

      - name: Upload pipeline artifacts for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.run_id }}
          path: |
            out/*.json
            out/script.txt
          if-no-files-found: ignore
          retention-days: 7
